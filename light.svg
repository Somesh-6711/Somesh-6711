<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="340" viewBox="0 0 1180 340" preserveAspectRatio="xMidYMid meet" fill="none" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Somesh Panchal — Machine Learning Engineer</title>
<desc id="dsc">I work on LLM inference — making large models serve faster and cheaper in production. I build benchmarking frameworks, quantize models, and ship them behind APIs that hold up under load. Mostly I like the unglamorous half: profilers, KV caches, and the gap between a model that works and a model that serves. Benchmark results: three times throughput, sixty percent less GPU memory, six inference configurations benchmarked. Stack: PyTorch · vLLM · CUDA · Transformers · LangGraph · FastAPI · Docker</desc>
